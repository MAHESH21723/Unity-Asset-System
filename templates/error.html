{% extends 'base.html' %}

{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="text-center py-5 glass-card border-secondary p-5">
        <i class="fa-solid fa-triangle-exclamation text-warning mb-4 error-icon"></i>
        <h1 class="h2 text-white">{{ code }} &middot; {{ title }}</h1>
        <p class="text-secondary">{{ description }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-custom mt-3">
            <i class="fa-solid fa-house me-2"></i> Back to home
        </a>
    </div>
</div>
{% endblock %}
